# Wrapper around OIDF docker-compose-prebuilt.yml.
# Images pinned by digest in images.lock. Not the Java tree.
services:
  mongodb:
    image: mongo@sha256:b415b12f638e2685d06c58ab7fb5943577c50fadec6d9340ef67d21aeac72070
    logging:
      driver: json-file
      options:
        max-size: 500k
        max-file: "5"
  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx@sha256:6a13e1c9ae2d19f2d0fea0a371905d580d61b960e0da84c01d5006729a5f1426
    ports:
      - "8443:8443"
      - "8444:8444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - localhost.emobix.co.uk
    depends_on:
      - server
    logging:
      driver: json-file
      options:
        max-size: 500k
        max-file: "5"
  server:
    image: registry.gitlab.com/openid/conformance-suite@sha256:f6b1bb02bc746dd216506f773bc19997b113072fd22dec515f7e3357e218d950
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    depends_on:
      - mongodb
    logging:
      driver: json-file
      options:
        max-size: 500k
        max-file: "5"
