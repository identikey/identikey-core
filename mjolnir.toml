# IdentiKey OP. Detector cannot infer a Rust workspace.
#
# `base_image` is a known Manifest key (mjolnir-6ee1). Pin the maintained
# spawn image so `mj deploy` does not fall through to deploy-node-bun.
# `mj deploy --base` still overrides. Host must be running a Mjolnir that
# honours this key; older Orchestrator ignored it and defaulted bun.
#
# ubuntu-24.04 has mise at /root/.local/bin but no /usr/local/bin shim, so
# PATH is explicit and `runtime` is omitted — that key prepends a bare
# `mise install`. June guest agent cannot unlock managed secrets
# (mjolnir-hjnz); current agent must land via inject or a snapshot copy.
# Mask serial-getty@ttyS0 (mjolnir-606w) or systemd waits 90s.
#
# Signing key and pairwise salt MUST be managed secrets (IDENTIKEY_SIGNING_KEY,
# IDENTIKEY_PAIRWISE_SALT). Do not let first-boot generate them onto the
# guest disk — cutover is a new VM and would mint a new issuer key / new
# pairwise people. DATABASE_URL comes from `mix mjolnir.pg.tenant ensure`.
base_image = "ubuntu-24.04"
port = 8080
start_command = "IDENTIKEY_BIND=0.0.0.0:8080 ./target/release/identikey-server"
steps = [
  "export PATH=/root/.local/bin:/usr/local/bin:$PATH; apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git pkg-config libssl-dev",
  "export PATH=/root/.local/bin:/usr/local/bin:$PATH; mise install bun@1.2.23; cd web && mise exec bun@1.2.23 -- bun install --frozen-lockfile && NODE_ENV=production mise exec bun@1.2.23 -- bun run build",
  "export PATH=/root/.cargo/bin:/root/.local/bin:/usr/local/bin:$PATH; mise install rust@1.96.0; . /root/.cargo/env; SQLX_OFFLINE=true cargo build --release --quiet -p identikey-server --locked",
  "ln -sfn /dev/null /etc/systemd/system/serial-getty@ttyS0.service",
]
