# IdentiKey OP. Detector cannot infer a Rust workspace.
#   mj deploy . --name identikey --memory 2048 --domain auth.identikey.me
#
# Build on ubuntu-24.04 (rpc base_image). deploy-node-bun currently misses
# the 30s boot window with the src virtiofs mount. ubuntu-24.04 has mise at
# /root/.local/bin but no /usr/local/bin shim, so PATH is explicit and
# `runtime` is omitted — that key prepends a bare `mise install`.
#
# Signing key and pairwise salt MUST be managed secrets (IDENTIKEY_SIGNING_KEY,
# IDENTIKEY_PAIRWISE_SALT). Do not let first-boot generate them onto the
# guest disk — cutover is a new VM and would mint a new issuer key / new
# pairwise people. DATABASE_URL comes from `mix mjolnir.pg.tenant ensure`.
steps = [
  "export PATH=/root/.local/bin:/usr/local/bin:$PATH; command -v git >/dev/null || (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git)",
  "export PATH=/root/.cargo/bin:/root/.local/bin:/usr/local/bin:$PATH; mise install rust@1.96.0; . /root/.cargo/env; SQLX_OFFLINE=true cargo build --release -p identikey-server --locked",
]
start_command = "IDENTIKEY_BIND=0.0.0.0:8080 ./target/release/identikey-server"
port = 8080
