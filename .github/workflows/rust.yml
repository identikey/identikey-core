name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # sqlx compiles queries against the committed .sqlx/ cache rather than a live
  # database. See identikey-core-xg2 and the `sqlx-offline-cache` job below.
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: identikey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # #[sqlx::test] creates throwaway DBs from this URL. Put a user in the
      # URL: sqlx 0.9 otherwise asks whoami, which can be `anonymous`.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/identikey
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      # --all-targets so the lints in [workspace.lints] reach tests too. An
      # unwrap in a test helper still panics in CI; the deny is not cosmetic.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  sqlx-offline-cache:
    # identikey-core-xg2. A stale .sqlx/ cache is worse than none: the build
    # passes here and fails against the real schema, which is exactly the class
    # of error the offline cache exists to prevent. This job fails when the
    # committed cache no longer matches the queries in the tree.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: identikey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/identikey
      PGUSER: postgres
      # prepare must talk to Postgres; the workspace default is offline.
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: sqlx-cli
          version: 0.9.0
          locked: true
          args: --no-default-features --features postgres,rustls
      - name: apply migrations
        run: sqlx migrate run --source crates/identikey-keys/migrations
      - name: verify the committed cache is current
        run: cargo sqlx prepare --workspace --check -- --all-targets
