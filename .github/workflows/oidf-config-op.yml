# Config OP only. Basic OP is a later change.
name: oidf-config-op

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config-op:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: identikey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/identikey
      PGUSER: postgres
      SQLX_OFFLINE: "true"
      IDENTIKEY_BIND: "0.0.0.0:8080"
      IDENTIKEY_ISSUER: "http://host.docker.internal:8080"
      IDENTIKEY_DATA_DIR: /tmp/identikey-oidf-data
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_EXPECTED_ORIGIN: http://localhost
      CONFORMANCE_DEV_MODE: "1"
      CONFORMANCE_SERVER: "https://127.0.0.1:8443"
      CONFORMANCE_SERVER_MTLS: "https://127.0.0.1:8444"
      DISABLE_SSL_VERIFY: "1"
      # Official script default when CONFORMANCE_SERVER is set.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build identikey-server
        run: cargo build -p identikey-server --release

      - name: checkout conformance-suite scripts (not a Cargo dep)
        run: |
          git clone --depth 1 --branch release-v5.1.43 \
            https://gitlab.com/openid/conformance-suite.git \
            /tmp/conformance-suite

      - name: python runner deps
        run: python3 -m pip install -r /tmp/conformance-suite/scripts/requirements.txt

      - name: start suite (pinned digests)
        run: docker compose -f docs/oidc/docker-compose.yml up -d

      - name: wait for suite
        run: |
          for i in $(seq 1 60); do
            if curl -kfsS https://127.0.0.1:8443/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "suite did not become ready"
          docker compose -f docs/oidc/docker-compose.yml logs
          exit 1

      - name: start identikey-server
        run: |
          mkdir -p "$IDENTIKEY_DATA_DIR"
          ./target/release/identikey-server &
          echo $! > /tmp/identikey-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          echo "identikey-server did not become ready"
          exit 1

      - name: discovery document names this issuer
        run: |
          curl -fsS http://127.0.0.1:8080/.well-known/openid-configuration \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "S256" in str(d); assert d["issuer"]=="http://host.docker.internal:8080"'

      - name: Config OP
        working-directory: /tmp/conformance-suite/scripts
        run: |
          python3 run-test-plan.py \
            oidcc-config-certification-test-plan \
            "${{ github.workspace }}/docs/oidc/config-op.json"

      - name: stop
        if: always()
        run: |
          if [ -f /tmp/identikey-server.pid ]; then
            kill "$(cat /tmp/identikey-server.pid)" || true
          fi
          docker compose -f docs/oidc/docker-compose.yml down || true
