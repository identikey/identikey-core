[package]
name = "identikey-server"
description = "The axum binary: wires the crates together and serves the web UI assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. These are product crates, and cargo-deny relies on this flag to
# scope its licence check to third-party code (see deny.toml, [licenses.private]).
publish = false

[lints]
workspace = true

[dependencies]
identikey-keys.workspace = true
identikey-oidc.workspace = true
identikey-recovery.workspace = true

axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webauthn-rs.workspace = true
uuid.workspace = true

[dev-dependencies]
bc-components.workspace = true
bc-xid.workspace = true
identikey-auth.workspace = true
base64 = "0.22"
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
