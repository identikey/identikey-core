[package]
name = "identikey-keys"
description = "Managed custody (C2): accounts, credentials, consent records, and the C2 to C3 migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. These are product crates, and cargo-deny relies on this flag to
# scope its licence check to third-party code (see deny.toml, [licenses.private]).
publish = false

[lints]
workspace = true

[dependencies]
bc-xid.workspace = true
bc-components.workspace = true
dcbor.workspace = true
sqlx.workspace = true
webauthn-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
bs58.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true
identikey-log.workspace = true
identikey-auth.workspace = true
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
